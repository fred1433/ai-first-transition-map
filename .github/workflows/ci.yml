name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Controls on recorded answers, the mutation, and the checks on the sources.
      # No network, no API key: a live model call is never part of a build.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
